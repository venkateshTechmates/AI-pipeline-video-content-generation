# Rendered by the nginx image's envsubst step (/etc/nginx/templates/*.template).
# API_UPSTREAM is set in the Dockerfile and can be overridden at runtime.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/* -> backend with the /api prefix stripped (trailing slash on proxy_pass).
    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # Server-Sent Events (GET /runs/{id}/events)
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        client_max_body_size 20m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for react-router routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
